<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0b1322" />
  <meta name="description" content="初雪：一个可以在雪地上写字的 3D 雪夜。" />
  <title>初雪 · First Snow</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b1322'/%3E%3Cg stroke='%23eaf2ff' stroke-width='3.4' stroke-linecap='round'%3E%3Cpath d='M32 12v40M14.7 22l34.6 20M14.7 42l34.6-20'/%3E%3Cpath d='M26 15l6 5 6-5M26 49l6-5 6 5'/%3E%3C/g%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    /* VOICE quiet, tender winter night · IDEA a snow globe you can write in
       PICTURE the full-screen 3D scene · COLOUR ink blue night, snow white, one warm lamp amber
       TYPE Noto Serif SC title, Noto Sans SC controls · LAYOUT title top-left, glass dock bottom */
    :root { --ink:#eef3fb; --dim:rgba(238,243,251,.62); --glass:rgba(12,19,33,.46); --line:rgba(255,255,255,.14); --warm:#ffbf78; color-scheme:dark; }
    * { box-sizing:border-box; min-width:0; }
    html, body { margin:0; height:100%; background:#0b1322; color:var(--ink); overflow:hidden;
      font:15px/1.5 "Noto Sans SC", system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; -webkit-tap-highlight-color:transparent; }
    #stage { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; outline:none; }
    body.writing #stage { cursor:crosshair; }
    .title { position:fixed; left:max(22px, env(safe-area-inset-left)); top:max(18px, env(safe-area-inset-top)); pointer-events:none;
      text-shadow:0 2px 18px rgba(0,0,0,.35); transition:opacity 1.2s; }
    .title h1 { margin:0; font:600 clamp(34px, 5vw, 52px)/1.05 "Noto Serif SC", serif; letter-spacing:.12em; }
    .title p { margin:6px 0 0; font-size:13px; letter-spacing:.32em; color:var(--dim); }
    .dock { position:fixed; left:50%; bottom:max(16px, env(safe-area-inset-bottom)); transform:translateX(-50%);
      display:flex; align-items:center; gap:10px; padding:10px 12px; width:max-content; max-width:calc(100vw - 20px);
      background:var(--glass); border:1px solid var(--line); border-radius:18px;
      backdrop-filter:blur(16px) saturate(1.2); -webkit-backdrop-filter:blur(16px) saturate(1.2); flex-wrap:wrap; justify-content:center; }
    .grp { display:flex; align-items:center; gap:8px; }
    .sep { width:1px; height:28px; background:var(--line); }
    label.amt { display:flex; align-items:center; gap:10px; font-size:13px; color:var(--dim); }
    #amtName { color:var(--ink); min-width:2.6em; font-size:14px; }
    input[type=range] { -webkit-appearance:none; appearance:none; width:130px; height:28px; background:transparent; }
    input[type=range]::-webkit-slider-runnable-track { height:4px; border-radius:4px; background:linear-gradient(90deg,#9fb6d9,#fff); }
    input[type=range]::-moz-range-track { height:4px; border-radius:4px; background:linear-gradient(90deg,#9fb6d9,#fff); }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:18px; height:18px; margin-top:-7px; border-radius:50%; background:#fff; box-shadow:0 0 0 4px rgba(255,255,255,.18); }
    input[type=range]::-moz-range-thumb { width:18px; height:18px; border:0; border-radius:50%; background:#fff; }
    button, .txt { font:inherit; color:var(--ink); background:rgba(255,255,255,.07); border:1px solid var(--line); border-radius:12px; height:40px; }
    button { padding:0 14px; cursor:pointer; display:inline-flex; align-items:center; gap:7px; white-space:nowrap; transition:background .2s, border-color .2s; }
    button:hover { background:rgba(255,255,255,.14); }
    button:focus-visible, .txt:focus-visible, input[type=range]:focus-visible { outline:2px solid #bcd3ff; outline-offset:2px; }
    button.on { background:rgba(255,191,120,.2); border-color:rgba(255,191,120,.6); color:#ffe3c2; }
    button svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
    .seg { display:flex; border:1px solid var(--line); border-radius:12px; overflow:hidden; }
    .seg button { border:0; border-radius:0; background:transparent; }
    .seg button.on { background:rgba(255,255,255,.16); color:#fff; }
    .txt { width:150px; padding:0 12px; font-size:16px; }
    .txt::placeholder { color:rgba(238,243,251,.45); }
    #toast { position:fixed; left:50%; bottom:96px; transform:translate(-50%, 10px); opacity:0; pointer-events:none;
      background:var(--glass); border:1px solid var(--line); padding:9px 16px; border-radius:999px; font-size:14px;
      backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); transition:opacity .4s, transform .4s; white-space:nowrap; max-width:92vw; overflow:hidden; text-overflow:ellipsis; }
    #toast.show { opacity:1; transform:translate(-50%, 0); }
    #loader { position:fixed; inset:0; display:grid; place-items:center; background:#0b1322; z-index:5; transition:opacity 1.4s; }
    #loader div { text-align:center; font:400 18px "Noto Serif SC", serif; letter-spacing:.3em; color:var(--dim); }
    #loader i { display:block; margin:14px auto 0; width:120px; height:2px; background:rgba(255,255,255,.12); overflow:hidden; border-radius:2px; }
    #loader b { display:block; height:100%; width:0; background:#fff; transition:width .3s; }
    #shot { position:fixed; inset:0; z-index:6; background:rgba(5,9,16,.78); display:none; place-items:center; padding:20px; }
    #shot.show { display:grid; }
    #shot figure { margin:0; max-width:min(900px, 94vw); text-align:center; }
    #shot img { width:100%; border-radius:14px; border:1px solid var(--line); display:block; }
    #shot figcaption { margin-top:12px; color:var(--dim); font-size:13px; display:flex; gap:10px; justify-content:center; align-items:center; flex-wrap:wrap; }
    #shot a { color:var(--ink); }
    @media (max-width:760px) {
      .dock { gap:8px; padding:8px; border-radius:16px; }
      .sep { display:none; }
      input[type=range] { width:96px; }
      .txt { width:118px; }
      button { padding:0 11px; }
      button .lb { display:none; }
      #toast { bottom:150px; }
    }
    @media (prefers-reduced-motion:reduce) { .title, #toast, #loader { transition:none; } }
  </style>
  <script type="importmap">
    { "imports": { "three": "./vendor/three/build/three.module.min.js", "three/addons/": "./vendor/three/addons/" } }
  </script>
</head>
<body>
  <canvas id="stage" tabindex="0" aria-label="3D 雪景：雪夜里的小木屋、圣诞树和路灯，可以在雪地上写字"></canvas>

  <header class="title" id="title">
    <h1>初雪</h1>
    <p>FIRST SNOW</p>
  </header>

  <nav class="dock" aria-label="雪景控制">
    <div class="grp">
      <label class="amt" title="雪量">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9"/></svg>
        <input id="amount" type="range" min="0" max="100" step="1" value="55" aria-label="雪量" />
        <span id="amtName">中雪</span>
      </label>
    </div>
    <div class="sep"></div>
    <div class="seg" role="group" aria-label="白天或夜晚">
      <button id="dayBtn" aria-pressed="false" title="白天">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span class="lb">白天</span></button>
      <button id="nightBtn" aria-pressed="true" title="夜晚">
        <svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg><span class="lb">夜晚</span></button>
    </div>
    <div class="sep"></div>
    <div class="grp">
      <button id="writeBtn" aria-pressed="false" title="在雪地上用手指写字">
        <svg viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16l-1 4z"/><path d="M14 7l3 3"/></svg><span class="lb">雪上写字</span></button>
      <input id="words" class="txt" type="text" maxlength="14" placeholder="输入一句话" aria-label="要刻进雪里的文字" />
      <button id="carveBtn" title="把文字刻进眼前的雪地">
        <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg><span class="lb">刻进雪里</span></button>
      <button id="smoothBtn" title="把雪地抹平">
        <svg viewBox="0 0 24 24"><path d="M3 17c3-2 6-2 9 0s6 2 9 0"/><path d="M3 11c3-2 6-2 9 0s6 2 9 0"/></svg><span class="lb">抹平</span></button>
    </div>
    <div class="sep"></div>
    <div class="grp">
      <button id="soundBtn" aria-pressed="false" title="风声">
        <svg viewBox="0 0 24 24"><path d="M4 9h3l5-4v14l-5-4H4z"/><path class="wave" d="M16 9a4 4 0 0 1 0 6M19 6a8 8 0 0 1 0 12"/></svg><span class="lb">风声</span></button>
      <button id="shotBtn" title="拍一张照片">
        <svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg><span class="lb">拍照</span></button>
    </div>
  </nav>

  <div id="toast" role="status" aria-live="polite"></div>

  <div id="shot" aria-hidden="true">
    <figure>
      <img id="shotImg" alt="雪景截图" />
      <figcaption><span>右键或长按图片即可保存</span><a id="shotDl" download="first-snow.png" href="#">下载</a><button id="shotClose">关闭</button></figcaption>
    </figure>
  </div>

  <div id="loader"><div>正在落雪<i><b id="bar"></b></i></div></div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
